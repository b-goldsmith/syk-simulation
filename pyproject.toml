[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
name = "syk_simulation"
version = "0.1.0"
description = "Using Trotterization, QDrift, and Qubitization in simulating SYK model."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Brian Goldsmith" },
    { name = "Larissa Kroell" },
    { name = "Nishna Aerabati" }
]

# https://peps.python.org/pep-0508/
dependencies = [
    "numpy",
    "scipy",
    "pyqsp", 
    "psiqdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit>=3.0.0",
    "black>=23.7.0"
]

[tool.setuptools]
packages = ["syk_simulation"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120